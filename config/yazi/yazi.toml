# Yazi 主配置（WezTerm4Neil · 侧边栏版）
# 参考: https://yazi-rs.github.io/docs/configuration/yazi/

[mgr]
# 单列文件列表：只保留「当前目录」一列，隐藏 parent 与 preview 面板
# （侧边栏宽度有限；预览改由右侧 Zellij 窗格 + nvim 负责）
ratio = [0, 4, 0]
sort_by = "natural"
sort_dir_first = true
show_hidden = false

# 打开器：文本文件用 wz-open.sh —— Zellij 内=悬浮窗整屏编辑器（优先 nvim，缺则 vim）。
[opener]
nvr = [
  { run = "bash ~/.local/bin/wz-open.sh \"%s1\"", orphan = true, for = "unix", desc = "悬浮窗编辑器打开" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = ["nvr"] },
  { mime = "application/json", use = ["nvr"] },
  { mime = "application/toml", use = ["nvr"] },
  { mime = "application/xml", use = ["nvr"] },
  { mime = "application/x-shellscript", use = ["nvr"] },
  { mime = "text/markdown", use = ["nvr"] },
  { url = "*.md", use = ["nvr"] },
  { url = "*.conf", use = ["nvr"] },
  # 其余类型（图片/视频/压缩包等）走系统默认打开方式
]
